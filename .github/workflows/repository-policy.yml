name: Repository Policy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  readme:
    name: README policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate LumioAgent specification
        run: |
          node .spec/tools/spec-lint.mjs
          node --test .spec/tools/spec-lint.test.mjs
      - name: Validate repository boundary documentation
        run: |
          test -s README.md
          test -s LICENSE
          test -s .gitattributes
          grep -q '^\*\.md text eol=lf$' .gitattributes
          grep -q '^## 这个仓是什么$' README.md
          grep -q '^## crate 一览$' README.md
          grep -q '^## SDK 如何编入$' README.md
          grep -q '^## 职责$' README.md
          grep -q '^## 明确不负责什么$' README.md
          grep -q '^## 收口门槛$' README.md
  native:
    name: Native workspace checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Build all features
        run: cargo build --workspace --all-features
      - name: Test default surface
        if: always()
        run: cargo test --workspace
      - name: Test prototypes and fixture-only APIs
        if: always()
        run: cargo test --workspace --all-features
      - name: Lint all targets and features
        if: always()
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Formatting
        if: always()
        run: cargo fmt --all --check
      - name: Dependency and artifact assertions
        if: always()
        run: |
          cargo xtask check-dep-dag
          cargo xtask assert-no-native-artifacts
          python -m unittest discover -s tools -p 'test_*.py'
      - name: Reference-only spatial build
        if: always()
        run: cargo test -p lumio-spatial --no-default-features
